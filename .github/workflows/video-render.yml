# Video Studio render worker.
#
# Rendering needs a headless Chrome and ffmpeg, neither of which exists in a Netlify function,
# and a 1080p render runs for minutes against a ~10 second execution limit. So the app only
# enqueues rows in video_render_jobs, and this workflow (or `npm run video:worker` on a Mac)
# claims and renders them. The two are interchangeable: whichever is up does the work, and the
# FOR UPDATE SKIP LOCKED claim means running both at once is safe.
name: video-render

on:
  # Fired by the admin panel immediately after a render is queued, so a job starts in seconds
  # rather than waiting for the schedule. See src/lib/video/dispatch.ts.
  repository_dispatch:
    types: [video-render]
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "How many jobs to drain in this run"
        required: false
        default: "2"
  # Safety net for anything queued while nothing was listening (a failed dispatch, a retry, a
  # job requeued by the stale-claim sweep).
  schedule:
    - cron: "*/15 * * * *"

# Never run two workers from this repo at once. The queue claim is safe under concurrency, but
# serialising keeps Actions-minute usage predictable and avoids two runners both paying to
# bundle Remotion.
concurrency:
  group: video-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # Generous, because a long-form 1080p render legitimately takes tens of minutes. The worker
    # heartbeats throughout; if the runner is killed anyway, the job is reclaimed after five
    # quiet minutes rather than being lost.
    timeout-minutes: 90

    steps:
      # WHICH CODE RENDERS. On a repository_dispatch there is no branch context, so a bare
      # checkout silently takes the DEFAULT BRANCH — meaning a render queued from a feature branch
      # builds main and produces a video from code you are not testing. That is invisible in the
      # UI: the job succeeds and the output simply lacks whatever you were working on.
      #
      # GITHUB_DISPATCH_REF (optional, set locally) rides along in the payload so a branch can be
      # rendered before it is merged. Unset, this resolves to the default branch exactly as before.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ASK BEFORE PAYING FOR SETUP. The schedule fires four times an hour whether or not anything
      # is queued, and everything below this used to run unconditionally — a browser install and an
      # apt-get, several minutes each, to then find an empty queue. This also tells us whether any
      # queued job needs B-roll, which is the only thing Chromium is for.
      - name: What is in the queue
        id: queue
        run: npm run video:queue-status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Cache browsers
        if: steps.queue.outputs.jobs != '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/remotion
          key: browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: browsers-${{ runner.os }}-

      # NO `--with-deps`, and only when a queued job actually captures a page.
      #
      # `--with-deps` shells out to apt-get, and when GitHub's Azure Ubuntu mirror is unreachable
      # that hangs: run #291 spent 9m43s emitting `Ign: azure.archive.ubuntu.com` before falling
      # back, against a 90-minute job budget with no step timeout to stop it. The ubuntu-latest
      # image already ships the shared libraries Chromium needs — it comes with Chrome, Edge and
      # Firefox preinstalled — so the apt call bought nothing and cost ten minutes.
      #
      # Bounded anyway: if this ever hangs again it fails in six minutes instead of burning the job.
      - name: Install Chromium
        if: steps.queue.outputs.broll == 'true'
        timeout-minutes: 6
        run: npx playwright install chromium

      # ffmpeg is preinstalled on ubuntu-latest. fonts-noto-cjk is the fallback face if the
      # Google Fonts fetch in src/remotion/fonts.ts fails — without a system CJK font, a failed
      # fetch renders Japanese as tofu boxes rather than degrading gracefully.
      #
      # Bounded and non-fatal for the same mirror reason: this is a FALLBACK font, so losing it is
      # a worse-looking render in one failure mode, while hanging on apt costs every render.
      # Explicit apt timeouts so a dead mirror is skipped rather than retried for minutes.
      - name: Install CJK fonts
        if: steps.queue.outputs.jobs != '0'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=15
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Drain the render queue
        if: steps.queue.outputs.jobs != '0'
        run: npm run video:worker -- --once --max-jobs=${{ github.event.inputs.max_jobs || 2 }} --runner=github-actions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_BUCKET_URL: ${{ secrets.R2_BUCKET_URL }}
          GOOGLE_TTS_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_TTS_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_TTS_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_TTS_SERVICE_ACCOUNT_PRIVATE_KEY }}
          # Only needed once B-roll capture lands; harmless before then.
          VIDEO_CAPTURE_BASE_URL: ${{ secrets.VIDEO_CAPTURE_BASE_URL }}
          VIDEO_CAPTURE_ADMIN_COOKIE: ${{ secrets.VIDEO_CAPTURE_ADMIN_COOKIE }}
          # The pipeline's last stage writes social copy for the finished render
          # (scripts/lib/social/autoGenerate.ts). These were missing, so every CI render logged
          # "Social copy: skipped (DEEPSEEK_API_KEY not set)" and the stage silently did nothing —
          # while the same worker run on a Mac, which reads .env, generated it fine. The skip is
          # deliberate and non-fatal, which is exactly why nobody noticed for a month.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SOCIAL_AUTOGEN: ${{ vars.SOCIAL_AUTOGEN }}
          SOCIAL_DAILY_COST_CAP_USD: ${{ vars.SOCIAL_DAILY_COST_CAP_USD }}
